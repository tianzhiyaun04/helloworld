<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hello World · 我的第一个 AI 开发的网站</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #0f172a;
      background-image: radial-gradient(circle at 20% 20%, #1e3a8a 0%, transparent 55%),
                        radial-gradient(circle at 80% 80%, #155e75 0%, transparent 55%);
      color: #e2e8f0;
    }
    .card {
      width: min(92vw, 720px);
      padding: 48px 40px;
      background: rgba(15, 23, 42, 0.72);
      border: 1px solid rgba(148, 163, 184, 0.25);
      border-radius: 20px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
      text-align: center;
      backdrop-filter: blur(10px);
    }
    .badge {
      display: inline-block;
      padding: 6px 14px;
      margin-bottom: 22px;
      font-size: 13px;
      letter-spacing: 0.08em;
      color: #67e8f9;
      border: 1px solid rgba(103, 232, 249, 0.4);
      border-radius: 999px;
    }
    h1 {
      margin: 0 0 12px;
      font-size: clamp(28px, 5vw, 46px);
      line-height: 1.25;
      font-weight: 700;
      background: linear-gradient(92deg, #67e8f9, #a78bfa 60%, #f472b6);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .subtitle {
      margin: 0 0 34px;
      font-size: clamp(16px, 2.4vw, 20px);
      color: #cbd5e1;
    }
    .divider {
      height: 1px;
      margin: 0 auto 28px;
      width: 72%;
      background: linear-gradient(90deg, transparent, rgba(148, 163, 184, 0.5), transparent);
    }
    .label { font-size: 13px; letter-spacing: 0.1em; color: #94a3b8; }
    .clock {
      margin-top: 10px;
      font-size: clamp(18px, 3vw, 26px);
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      color: #f1f5f9;
    }
    .meta {
      margin-top: 10px;
      font-size: 13px;
      color: #94a3b8;
    }
    .meta code {
      padding: 2px 7px;
      border-radius: 6px;
      background: rgba(148, 163, 184, 0.16);
      color: #cbd5e1;
    }
    .status {
      margin-top: 26px;
      font-size: 13px;
      color: #94a3b8;
    }
    .dot {
      display: inline-block;
      width: 8px; height: 8px; margin-right: 6px;
      border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.18);
    }
    .dot.err { background: #ef4444; box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.18); }
  </style>
</head>
<body>
  <main class="card">
    <div class="badge">NODE.JS · MY FIRST WEBSITE</div>
    <h1>Hello World！</h1>
    <p class="subtitle">我的第一个AI开发的网站</p>

    <div class="divider"></div>

    <div class="label">服务器时间 / SERVER TIME</div>
    <div class="clock" id="clock">正在获取服务器时间…</div>
    <div class="meta" id="meta">数据来源：<code>GET /api/time</code></div>

    <div class="status"><span class="dot" id="dot"></span><span id="statusText">正在连接服务器…</span></div>
  </main>

  <script>
    (function () {
      var clock = document.getElementById('clock');
      var meta = document.getElementById('meta');
      var dot = document.getElementById('dot');
      var statusText = document.getElementById('statusText');

      var offset = 0;        // 服务器时间 - 本地时间（毫秒）
      var timer = null;

      function two(n) { return n < 10 ? '0' + n : '' + n; }

      function formatCST(ms) {
        var d = new Date(ms + offset);
        var utc8 = new Date(d.getTime() + d.getTimezoneOffset() * 60000 + 8 * 3600000);
        return utc8.getFullYear() + '年' + two(utc8.getMonth() + 1) + '月' + two(utc8.getDate()) + '日 '
          + '星期' + '日一二三四五六'.charAt(utc8.getDay()) + '  '
          + two(utc8.getHours()) + ':' + two(utc8.getMinutes()) + ':' + two(utc8.getSeconds());
      }

      function render() {
        clock.textContent = formatCST(Date.now());
      }

      function tick() {
        render();
        timer = setTimeout(tick, 1000);
      }

      var syncTimer = null;

      function fail() {
        dot.className = 'dot err';
        statusText.textContent = '未能获取服务器时间（/api/time 不可用），以下为本地时间';
        syncTimer = setTimeout(sync, 5000);
        if (!timer) { tick(); }
      }

      function sync() {
        var xhr = new XMLHttpRequest();
        xhr.open('GET', '/api/time?_=' + Date.now(), true);
        xhr.timeout = 8000;
        xhr.onload = function () {
          try {
            var data = JSON.parse(xhr.responseText);
            var serverNow = new Date(data.iso).getTime();
            offset = serverNow - Date.now();
            dot.className = 'dot';
            statusText.textContent = '已连接服务器 · 时区 ' + (data.timezone || 'Asia/Shanghai');
            meta.innerHTML = '数据来源：<code>GET /api/time</code> · 服务器时钟 ' +
              (data.serverClock || '');
            if (timer) { clearTimeout(timer); }
            tick();
          } catch (e) {
            fail();
          }
        };
        xhr.onerror = fail;
        xhr.ontimeout = fail;
      }

      sync();
    })();
  </script>
</body>
</html>
